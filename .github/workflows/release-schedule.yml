name: "Release: Scheduled"

permissions: {}

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 AM UTC on the default branch
  workflow_dispatch:

jobs:
  release-schedule:
    name: "Release: Scheduled"
    uses: dargmuesli/github-actions/.github/workflows/release-schedule.yml@4ebcf3dea4b29ee73e5c133d3da40ae01c89a194 # 5.9.3
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      IS_DEBOUNCED: ${{ github.event_name != 'workflow_dispatch' }}
