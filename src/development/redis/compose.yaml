services:
  redis:
    # You cannot access the caching system via a web interface.
    deploy:
      labels:
        - dargstack.profiles=zammad
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    image: redis:8.12.0-alpine@sha256:ff55e25203f915f2fe9cc1428e6da969fec257dd6e6feb71a34fd0cf3a86b289
    volumes:
      - redis-data:/data
volumes:
  redis-data:
    # The caching system's data.
    {}
