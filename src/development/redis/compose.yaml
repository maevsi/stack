services:
  redis:
    # You cannot access the caching system via a web interface.
    deploy:
      labels:
        - dargstack.profiles=zammad
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    volumes:
      - redis-data:/data
volumes:
  redis-data:
    # The caching system's data.
    {}
