services:
  geoip:
    # You cannot access the ip geolocator via a web interface.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: ghcr.io/observabilitystack/geoip-api:2026-46@sha256:37e73786f3d2b0f4b383ef7bff727ca38622702bf6aa3549d0d5ca28fb767a14
