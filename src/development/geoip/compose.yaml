services:
  geoip:
    # You cannot access the ip geolocator via a web interface.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    image: ghcr.io/observabilitystack/geoip-api:2026-47@sha256:cd3957d8021801fc0018ce265ae46862aa28d5951e16f6e54e5f8e0f33edf0ea
