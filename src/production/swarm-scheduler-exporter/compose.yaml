services:
  swarm-scheduler-exporter:
    # The exporter that reports the swarm's state, its nodes and each service's tasks to the metrics monitoring.
    cap_drop:
      - ALL
    command: ["--label", "vibetype.one-shot"]
    deploy:
      labels:
        - dargstack.profiles=analytics
      placement:
        constraints:
          # Only a manager's docker daemon serves the cluster-wide data the exporter reads.
          - node.role == manager
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
      update_config:
        order: start-first
    environment:
      # The exporter reads the Docker API through the allowlisted socket proxy instead of the socket itself.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    healthcheck:
      # The image is distroless and has no shell, so the binary probes its own readiness endpoint.
      test: ["CMD", "/usr/local/bin/swarm-scheduler-exporter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    image: ghcr.io/leinardi/swarm-scheduler-exporter:v2.0.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
    networks:
      - default
      - docker-socket-proxy
    read_only: true
