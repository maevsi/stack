services:
  tusd:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.tusd.middlewares=redirectscheme,tusd-cors
        - traefik.http.routers.tusd-secure.tls.certresolver=default
      update_config:
        order: start-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
