services:
  reccoom:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.23.5@sha256:79ef5b7cd7272004eebe0df20aa8e7b90781d2455c458419634f66df609e465d
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  reccoom-consumer:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.23.5@sha256:79ef5b7cd7272004eebe0df20aa8e7b90781d2455c458419634f66df609e465d
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  reccoom-migration:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.23.5@sha256:79ef5b7cd7272004eebe0df20aa8e7b90781d2455c458419634f66df609e465d
  reccoom-postgres:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
