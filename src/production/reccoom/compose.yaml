services:
  reccoom:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.24.2@sha256:e646d3b54d6a031b75cc08cfac2395380fc6941cdd6aca43669f7b9985f469ff
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  reccoom-consumer:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.24.2@sha256:e646d3b54d6a031b75cc08cfac2395380fc6941cdd6aca43669f7b9985f469ff
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  reccoom-migration:
    deploy:
      update_config:
        order: start-first
    environment:
      SENTRY_TRACES_SAMPLE_RATE: "0.1"
    image: ghcr.io/maevsi/reccoom:0.24.2@sha256:e646d3b54d6a031b75cc08cfac2395380fc6941cdd6aca43669f7b9985f469ff
  reccoom-postgres:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
