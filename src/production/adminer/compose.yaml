services:
  adminer:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.adminer-secure.tls.certresolver=default
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: start-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
