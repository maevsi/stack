networks:
  docker-socket-proxy:
    # Internal: nothing outside the exporter can reach the proxy.
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: "1400"
    internal: true
services:
  docker-socket-proxy:
    # The allowlisted proxy in front of the manager's docker socket, for the swarm scheduler exporter.
    cap_drop:
      - ALL
    deploy:
      labels:
        - dargstack.profiles=analytics
      placement:
        constraints:
          # Only a manager's docker daemon answers the cluster-wide service, node and task calls.
          - node.role == manager
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 32m
      update_config:
        order: start-first
    env_file:
      - ./configurations/allowlist.env
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
    networks:
      - docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
