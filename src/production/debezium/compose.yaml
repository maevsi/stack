services:
  debezium:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  debezium-postgres-connector:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
