services:
  redpanda:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  redpanda-console:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.redpanda-secure.tls.certresolver=default
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: start-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
