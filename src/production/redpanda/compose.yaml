services:
  redpanda:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
  redpanda-console:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.redpanda-secure.tls.certresolver=default
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: start-first
