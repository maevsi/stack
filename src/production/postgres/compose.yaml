secrets:
  postgres-backup-db:
    # The database's name.
    external: true
services:
  postgres:
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
  postgres-backup:
    # You cannot access the database backup directly.
    deploy:
      placement:
        constraints:
          - node.labels.vibetype.storage == true
      update_config:
        order: stop-first
    environment:
      POSTGRES_DB_FILE: /run/secrets/postgres-backup-db
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_USER_FILE: /run/secrets/postgres-user
    healthcheck:
      # The image probes only every 5m, and swarm does not count the task as running before its first passing probe.
      start_interval: 5s
      start_period: 1m
    image: prodrigestivill/postgres-backup-local:18-alpine
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
    secrets:
      - postgres-backup-db
      - postgres-password
      - postgres-user
    volumes:
      - postgres-data:/var/lib/postgresql/
      - postgres-backup-data:/backups/
volumes:
  postgres-backup-data:
    # The database backup's data.
    {}
