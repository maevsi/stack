services:
  postgraphile:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.postgraphile-secure.tls.certresolver=default
        - traefik.http.routers.postgraphile-secure-ruru.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/maevsi/postgraphile:3.5.2@sha256:e5349084048432498e64d090924fe517f0116b3e6b7a8ec0f31cf6a3c97444f8
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
