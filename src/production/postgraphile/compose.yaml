services:
  postgraphile:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.postgraphile-secure.tls.certresolver=default
        - traefik.http.routers.postgraphile-secure-ruru.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/maevsi/postgraphile:2.3.1
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
