services:
  postgraphile:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.postgraphile-secure.tls.certresolver=default
        - traefik.http.routers.postgraphile-secure-ruru.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/maevsi/postgraphile:3.1.0@sha256:3b96f1aac2477c6e65da3e99f315845f917c19e2a15aacfa59a6dc61d33083ab
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
