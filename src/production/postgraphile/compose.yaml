services:
  postgraphile:
    deploy:
      labels:
        - (( append ))
        - traefik.http.routers.postgraphile-secure.tls.certresolver=default
        - traefik.http.routers.postgraphile-secure-ruru.tls.certresolver=default
      update_config:
        order: start-first
    image: ghcr.io/maevsi/postgraphile:3.2.0@sha256:d13b87d7efd5374f44c03d3d3d3697656439c6d77f771ca3d1f7d838dd3a6622
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 20m
